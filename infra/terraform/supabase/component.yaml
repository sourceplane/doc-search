apiVersion: sourceplane.io/v1
kind: Component

metadata:
  name: supabase
  description: Provisions Supabase projects for stage and prod and wires credentials into orun secrets
  labels:
    domain: infra
    scope: database

spec:
  type: terraform
  lifecycle: production
  owner: platform
  # Its pages, attached to it in the workspace's catalog: what the Docs
  # library shows for it, and what the catalog's docs and runbook checks read.
  # Generated from what this manifest and its sources declare.
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  domain: infra

  parameters:
    orgName: sourceplane
    stackName: supabase
    terraformDir: terraform
    terraformVersion: "1.15.3"
    # Supabase region is surfaced to Terraform as TF_VAR_supabaseRegion by the
    # terraform composition's parameter→TF_VAR loop. The org id is NOT committed
    # here: it is account-specific and injected as TF_VAR_supabaseOrgId from the
    # SUPABASE_ORG_ID CI secret (see .github/workflows/ci.yml). Keeping it out of
    # parameters also prevents the param→TF_VAR loop from overriding the secret.
    supabaseRegion: ap-southeast-1
    # SEC-JOB: post-apply, these outputs are queued on the runner's sink and
    # lease-published onto the project/{{env}} rung by the runner. Exactly
    # what the tree reads (Lumen's three): cloudflare-hyperdrive takes the ref
    # and the password, db-migrate all three. This app reaches Supabase only
    # as Postgres, so no API key is published.
    secretOutputs: "SUPABASE_PROJECT_REF=project_ref,SUPABASE_DB_PASSWORD=database_password,SUPABASE_DB_URL=connection_uri"

  # Both values resolve from orun secrets (project rung, brokered from the
  # Supabase integration): a short-lived Management-API access token minted
  # fresh per run (management-access template — the provider reads
  # SUPABASE_ACCESS_TOKEN from env natively), and the org id as a non-secret
  # connection fact (org-id template) surfaced straight to Terraform. The
  # SUPABASE_ORG_ID CI secret and its TF_VAR mapping are retired.
  secretEnv:
    SUPABASE_ACCESS_TOKEN: "secret://doc-search/doc-search/{{ .environment }}/SUPABASE_ACCESS_TOKEN"
    TF_VAR_supabaseOrgId: "secret://doc-search/doc-search/{{ .environment }}/SUPABASE_ORG_ID"

  subscribe:
    environments:
      - name: stage
        profile: plan-only
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main

      - name: prod
        profile: plan-only
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main
