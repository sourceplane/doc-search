apiVersion: sourceplane.io/v1
kind: Component

metadata:
  name: cloudflare-hyperdrive
  description: Provisions Cloudflare Hyperdrive resources for stage and prod Supabase Postgres databases
  labels:
    domain: infra
    scope: runtime-database-gateway

spec:
  type: terraform
  lifecycle: production
  owner: platform
  # Its pages, attached to it in the workspace's catalog: what the Docs
  # library shows for it, and what the catalog's docs and runbook checks read.
  # Generated from what this manifest and its sources declare.
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  domain: infra

  # Hyperdrive's origin is the Supabase project's Postgres, whose ref and
  # password the `supabase` apply lease-publishes (SUPABASE_PROJECT_REF,
  # SUPABASE_DB_PASSWORD, read below). A job resolves its secrets when it
  # starts, so on main this waits for that apply, `mode: enforced`; a pull
  # request applies nothing, so there it is advisory.
  dependsOn:
    - component: supabase
      mode: enforced
      modeRules:
        - mode: advisory
          when:
            triggerRef: github-pull-request

  parameters:
    orgName: sourceplane
    stackName: cloudflare-hyperdrive
    terraformDir: terraform
    terraformVersion: "1.15.3"
    # SEC-JOB: the wiring document (hyperdrive id/name) is lease-published
    # post-apply; worker deploys read it back as WIRING_CLOUDFLARE_HYPERDRIVE_<ENV>.
    secretOutputs: "WIRING_CLOUDFLARE_HYPERDRIVE=wiring"

  # All three values resolve from orun secrets (project rung, brokered from
  # the Cloudflare integration): the provider credential is minted fresh per
  # run from the hyperdrive-edit template (Workers Hyperdrive Write — the
  # workers-deploy token deliberately cannot touch Hyperdrive), and the
  # account id is a non-secret connection fact (account-id template).
  # Component-level because plan-only lanes refresh against the live API too.
  secretEnv:
    CLOUDFLARE_API_TOKEN: "secret://doc-search/doc-search/{{ .environment }}/CLOUDFLARE_HYPERDRIVE_TOKEN"
    CLOUDFLARE_ACCOUNT_ID: "secret://doc-search/doc-search/{{ .environment }}/CLOUDFLARE_ACCOUNT_ID"
    TF_VAR_cloudflare_account_id: "secret://doc-search/doc-search/{{ .environment }}/CLOUDFLARE_ACCOUNT_ID"
    # Supabase origin, lease-published by the supabase component's
    # secretOutputs — the replacement for the Secrets Manager data source.
    TF_VAR_supabase_project_ref: "secret://doc-search/doc-search/{{ .environment }}/SUPABASE_PROJECT_REF"
    TF_VAR_supabase_db_password: "secret://doc-search/doc-search/{{ .environment }}/SUPABASE_DB_PASSWORD"

  subscribe:
    environments:
      - name: stage
        profile: plan-only
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main

      - name: prod
        profile: plan-only
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main
