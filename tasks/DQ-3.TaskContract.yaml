apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: DQ-3
  title: "A baseline"
spec:
  goal: The repository becomes an Orun baseline that takes a new doc search product from nothing to live on stage and prod in one landing, its docs indexed by the deploy, and records what went live
  affects:
    - blueprint.yaml
    - repo-blueprint.yaml
    - BOOTSTRAP.md
    - .baseline
    - tooling/rebrand
    - tooling/bootstrap
    - hooks
    - docs/phases
    - ai/context
    - testing
    - .github/workflows/baseline.yml
    - .github/workflows/tag.yml
  doneWhen:
    - the card and the build document agree (testing/manifest.test.sh), and the platform's card reader accepts the card
    - a placed product carries the product only, renamed throughout (leak, placement)
    - the end-to-end tier builds, migrates, dry-deploys and serves the product, finds the index empty, indexes it with the product's own smoke, skips unchanged pages, embeds once under two concurrent indexes, and answers a question from the matched section
    - Baseline CI is green on main
  gates: []
